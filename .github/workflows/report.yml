name: Platform HTML Report

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL for route checks
        required: true
        default: https://portfolio.srinivaspitchubabu.click
        type: string
      log_since:
        description: Docker log time window for alert and page-view reporting
        required: true
        default: "24h"
        type: string
      log_tail_lines:
        description: Container log lines to scan for alerts
        required: true
        default: "all"
        type: string
      log_alert_detail_limit:
        description: Maximum alert detail rows to include in the HTML report
        required: true
        default: "40"
        type: string
      page_view_log_lines:
        description: Portfolio log lines to scan for approximate page views
        required: true
        default: "all"
        type: string
      send_email:
        description: Keep yes to send email. Leave empty to skip email for this manual run.
        required: false
        default: "yes"
        type: string

permissions:
  contents: read

env:
  TARGET_BRANCH: main
  MIN_MEMORY_MB: "128"
  ALLOW_SWAP_MEMORY: "true"
  COMPOSE_NETWORK_NAME: app_default
  DEPLOYMENT_STATE_DIR: /home/ec2-user/portfolio-deployment/releases

jobs:
  report:
    name: Generate platform HTML report
    runs-on: self-hosted
    steps:
      - name: Prepare workspace permissions
        run: |
          if [ -d "$GITHUB_WORKSPACE" ] && command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Synchronize repository
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          chmod +x deployment/scripts/*.sh
          deployment/scripts/git-sync.sh

      - name: Generate HTML report
        id: report
        env:
          REPORT_BASE_URL: ${{ inputs.base_url || 'https://portfolio.srinivaspitchubabu.click' }}
          REPORT_LOG_SINCE: ${{ inputs.log_since || '24h' }}
          REPORT_LOG_TAIL_LINES: ${{ inputs.log_tail_lines || 'all' }}
          REPORT_LOG_ALERT_DETAIL_LIMIT: ${{ inputs.log_alert_detail_limit || '40' }}
          REPORT_PAGE_VIEW_LOG_LINES: ${{ inputs.page_view_log_lines || 'all' }}
        run: bash deployment/scripts/generate-html-report.sh

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-platform-report
          path: ${{ steps.report.outputs.report_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Send HTML report email
        if: ${{ github.event_name == 'schedule' || inputs.send_email == 'yes' }}
        env:
          REPORT_HTML_FILE: ${{ steps.report.outputs.report_path }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
          REPORT_EMAIL_SUBJECT: Portfolio Platform 24-hour Report - ${{ steps.report.outputs.report_date }}
          CONTACT_CONTAINER_NAME: contact_service
        run: bash deployment/scripts/send-html-report-email.sh

      - name: Report summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          SEND_EMAIL_INPUT: ${{ inputs.send_email || '' }}
        run: |
          email_status="yes"
          if [ "$EVENT_NAME" != "schedule" ] && [ "$SEND_EMAIL_INPUT" != "yes" ]; then
            email_status="no"
          fi

          {
            echo "## Platform HTML Report"
            echo
            echo "- Report artifact: portfolio-platform-report"
            echo "- Report path: ${{ steps.report.outputs.report_path }}"
            echo "- Base URL: ${{ steps.report.outputs.report_base_url }}"
            echo "- Log window: ${{ steps.report.outputs.report_log_since }}"
            echo "- Health score: ${{ steps.report.outputs.health_score }}%"
            echo "- Server status: ${{ steps.report.outputs.server_status }}"
            echo "- Email sent: $email_status"
          } >> "$GITHUB_STEP_SUMMARY"
