name: Master Platform CI/CD

on:
  workflow_dispatch:
    inputs:
      smoke_base_url:
        description: Base URL for post-deployment smoke tests
        required: true
        default: http://127.0.0.1

permissions:
  contents: read

env:
  TARGET_BRANCH: main
  MIN_MEMORY_MB: "256"
  ALLOW_SWAP_MEMORY: "true"
  DEPLOYMENT_STATE_DIR: /home/ec2-user/portfolio-deployment/releases
  COMPOSE_NETWORK_NAME: app_default
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}

jobs:
  validation:
    name: Platform validation
    runs-on: self-hosted
    steps:
      - name: Prepare workspace permissions
        run: |
          if [ -d "$GITHUB_WORKSPACE" ] && command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run PR code validation
        run: |
          chmod +x deployment/scripts/*.sh
          deployment/scripts/code-validation.sh

      - name: Run platform pre-validation
        env:
          SERVICE_NAME: platform
          COMPOSE_SERVICE: portfolio_service
          REQUIRE_IMAGE_CONFIG: "false"
          REQUIRE_SERVICE_DOCKERFILE: "false"
          REQUIRED_COMPOSE_SERVICES: portfolio_service,blog_service,projects_service,experience_service,contact_service
        run: deployment/scripts/pre-validation.sh

  build:
    name: Build platform service images
    runs-on: self-hosted
    needs: validation
    environment: build-approval
    steps:
      - name: Prepare workspace permissions
        run: |
          if [ -d "$GITHUB_WORKSPACE" ] && command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Synchronize repository
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          chmod +x deployment/scripts/*.sh
          deployment/scripts/git-sync.sh

      - name: Build and validate portfolio image
        env:
          SERVICE_NAME: portfolio
          SERVICE_PATH: portfolio
          IMAGE_NAME: portfolio
          IMAGE_TAG: ${{ github.sha }}
          VALIDATE_IMAGE_STARTUP: "false"
        run: |
          deployment/scripts/build-image.sh
          deployment/scripts/validate-image.sh

      - name: Build and validate blog image
        env:
          SERVICE_NAME: blog
          SERVICE_PATH: blog
          IMAGE_NAME: blog
          IMAGE_TAG: ${{ github.sha }}
          VALIDATE_IMAGE_STARTUP: "false"
        run: |
          deployment/scripts/build-image.sh
          deployment/scripts/validate-image.sh

      - name: Build and validate projects image
        env:
          SERVICE_NAME: projects
          SERVICE_PATH: projects
          IMAGE_NAME: projects
          IMAGE_TAG: ${{ github.sha }}
          VALIDATE_IMAGE_STARTUP: "false"
        run: |
          deployment/scripts/build-image.sh
          deployment/scripts/validate-image.sh

      - name: Build and validate experience image
        env:
          SERVICE_NAME: experience
          SERVICE_PATH: experience
          IMAGE_NAME: experience
          IMAGE_TAG: ${{ github.sha }}
          VALIDATE_IMAGE_STARTUP: "false"
        run: |
          deployment/scripts/build-image.sh
          deployment/scripts/validate-image.sh

      - name: Build and validate contact image
        env:
          SERVICE_NAME: contact
          SERVICE_PATH: contact
          IMAGE_NAME: contact
          IMAGE_TAG: ${{ github.sha }}
          VALIDATE_IMAGE_STARTUP: "false"
        run: |
          deployment/scripts/build-image.sh
          deployment/scripts/validate-image.sh

  deploy:
    name: Deploy platform services
    runs-on: self-hosted
    needs: build
    environment: production-deploy
    steps:
      - name: Prepare workspace permissions
        run: |
          if [ -d "$GITHUB_WORKSPACE" ] && command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Synchronize repository
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          chmod +x deployment/scripts/*.sh
          deployment/scripts/git-sync.sh

      - name: Decommission legacy Nginx Proxy Manager gateway
        env:
          DECOMMISSION_LEGACY_GATEWAY: "true"
        run: deployment/scripts/decommission-legacy-gateway.sh

      - name: Deploy and validate portfolio service
        env:
          SERVICE_NAME: portfolio
          COMPOSE_SERVICE: portfolio_service
          CONTAINER_NAME: portfolio_service
          IMAGE_NAME: portfolio
          IMAGE_TAG_ENV_VAR: PORTFOLIO_IMAGE_TAG
          HEALTH_CHECK_MODE: container-exec
          HEALTH_URL: http://127.0.0.1/
          IMAGE_TAG: ${{ github.sha }}
        run: |
          deployment/scripts/deploy-service.sh
          deployment/scripts/validate-service.sh
          deployment/scripts/cleanup.sh

      - name: Deploy and validate blog service
        env:
          SERVICE_NAME: blog
          COMPOSE_SERVICE: blog_service
          CONTAINER_NAME: blog_service
          IMAGE_NAME: blog
          IMAGE_TAG_ENV_VAR: BLOG_IMAGE_TAG
          HEALTH_CHECK_MODE: container-exec
          HEALTH_URL: http://127.0.0.1/
          IMAGE_TAG: ${{ github.sha }}
        run: |
          deployment/scripts/deploy-service.sh
          deployment/scripts/validate-service.sh
          deployment/scripts/cleanup.sh

      - name: Deploy and validate projects service
        env:
          SERVICE_NAME: projects
          COMPOSE_SERVICE: projects_service
          CONTAINER_NAME: projects_service
          IMAGE_NAME: projects
          IMAGE_TAG_ENV_VAR: PROJECTS_IMAGE_TAG
          HEALTH_CHECK_MODE: container-exec
          HEALTH_URL: http://127.0.0.1/
          IMAGE_TAG: ${{ github.sha }}
        run: |
          deployment/scripts/deploy-service.sh
          deployment/scripts/validate-service.sh
          deployment/scripts/cleanup.sh

      - name: Deploy and validate experience service
        env:
          SERVICE_NAME: experience
          COMPOSE_SERVICE: experience_service
          CONTAINER_NAME: experience_service
          IMAGE_NAME: experience
          IMAGE_TAG_ENV_VAR: EXPERIENCE_IMAGE_TAG
          HEALTH_CHECK_MODE: container-exec
          HEALTH_URL: http://127.0.0.1/
          IMAGE_TAG: ${{ github.sha }}
        run: |
          deployment/scripts/deploy-service.sh
          deployment/scripts/validate-service.sh
          deployment/scripts/cleanup.sh

      - name: Render contact runtime environment
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL }}
          SES_TO_EMAIL: ${{ secrets.SES_TO_EMAIL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          PORT: "3000"
          NODE_ENV: production
        run: deployment/scripts/render-contact-env.sh

      - name: Deploy and validate contact service
        env:
          SERVICE_NAME: contact
          COMPOSE_SERVICE: contact_service
          CONTAINER_NAME: contact_service
          IMAGE_NAME: contact
          IMAGE_TAG_ENV_VAR: CONTACT_IMAGE_TAG
          HEALTH_CHECK_MODE: container-exec
          HEALTH_URL: http://127.0.0.1:3000/health
          IMAGE_TAG: ${{ github.sha }}
        run: |
          deployment/scripts/deploy-service.sh
          deployment/scripts/validate-service.sh
          deployment/scripts/cleanup.sh

      - name: Run hosted path smoke tests
        env:
          SMOKE_BASE_URL: ${{ github.event.inputs.smoke_base_url }}
        run: deployment/scripts/smoke-test.sh

      - name: Deployment summary
        run: |
          {
            echo "## Master Platform Deployment"
            echo
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Services deployed: portfolio, blog, projects, experience, contact"
            echo "- Smoke test base URL: \`${{ github.event.inputs.smoke_base_url }}\`"
            echo "- Deployment mode: sequential service deployment with \`--no-deps\`"
          } >> "$GITHUB_STEP_SUMMARY"
