<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunities - Srinivas</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="navbar">
    <a class="brand" href="/">Srinivas Pitchubabu</a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="primary-nav" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav id="primary-nav" class="nav">
      <a href="/#hero">About</a>
      <a href="/experience/">Experience</a>
      <a href="/projects/">Projects</a>
      <a href="/contact.html">Opportunities</a>
      <a href="/blog/">Blog</a>
    </nav>
    <button id="theme-toggle" aria-label="Toggle color theme">Light</button>
  </header>

  <main class="section">
    <h1 class="section-title">Opportunities &amp; Contact</h1>
    <p>Have an exciting SRE, DevOps, or Cloud opportunity? I would love to hear from you.</p>

    <form id="contact-form" class="card contact-form">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-field">
        <label for="company">Company</label>
        <input type="text" id="company" name="company">
      </div>

      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <button type="submit" class="btn primary">Send Message</button>
      <p id="form-status" class="form-status"></p>
    </form>
  </main>

  <footer class="footer">
    <p>&copy; 2025 Srinivas Pitchubabu</p>
    <div class="socials">
      <span class="social-link" title="GitHub profile URL pending"><img src="assets/icons/github.svg" alt="GitHub"></span>
      <span class="social-link" title="LinkedIn profile URL pending"><img src="assets/icons/linkedin.svg" alt="LinkedIn"></span>
      <a href="/contact.html" aria-label="Contact page"><img src="assets/icons/mail.svg" alt=""></a>
    </div>
  </footer>

  <script>
    document.getElementById('contact-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const statusEl = document.getElementById('form-status');
      statusEl.textContent = 'Sending...';

      const formData = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        company: document.getElementById('company').value,
        message: document.getElementById('message').value
      };

      try {
        const response = await fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          statusEl.textContent = 'Message sent. I will be in touch soon.';
          statusEl.style.color = 'green';
          document.getElementById('contact-form').reset();
        } else {
          statusEl.textContent = 'Error sending message. Please try again.';
          statusEl.style.color = 'red';
        }
      } catch (error) {
        statusEl.textContent = 'Error sending message. Please try again.';
        statusEl.style.color = 'red';
      }
    });
  </script>
</body>
</html>
