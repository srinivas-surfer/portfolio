server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /assets {
    return 404;
  }

  location = /assets/ {
    return 404;
  }

  location = /assets/icons {
    return 404;
  }

  location = /assets/icons/ {
    return 404;
  }

  location = /blog {
    return 301 /blog/;
  }

  location /blog/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $blog_upstream blog_service:80;
    rewrite ^/blog/(.*)$ /$1 break;
    proxy_pass http://$blog_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /blog;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location = /projects {
    return 301 /projects/;
  }

  location /projects/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $projects_upstream projects_service:80;
    rewrite ^/projects/(.*)$ /$1 break;
    proxy_pass http://$projects_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /projects;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location = /experience {
    return 301 /experience/;
  }

  location /experience/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $experience_upstream experience_service:80;
    rewrite ^/experience/(.*)$ /$1 break;
    proxy_pass http://$experience_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /experience;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  # API proxy to contact service
  location /api/contact {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $contact_upstream contact_service:3000;
    proxy_pass http://$contact_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
