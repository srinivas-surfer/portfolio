services:
  # Portfolio Service (Homepage + Contact Form)
  portfolio_service:
    build: ./portfolio
    image: ${DOCKERHUB_NAMESPACE:-local}/portfolio:${PORTFOLIO_IMAGE_TAG:-latest}
    container_name: portfolio_service
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Experience Service
  experience_service:
    build: ./experience
    image: ${DOCKERHUB_NAMESPACE:-local}/experience:${EXPERIENCE_IMAGE_TAG:-latest}
    container_name: experience_service
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Projects Service
  projects_service:
    build: ./projects
    image: ${DOCKERHUB_NAMESPACE:-local}/projects:${PROJECTS_IMAGE_TAG:-latest}
    container_name: projects_service
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Blog Service
  blog_service:
    build: ./blog
    image: ${DOCKERHUB_NAMESPACE:-local}/blog:${BLOG_IMAGE_TAG:-latest}
    container_name: blog_service
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Contact Service (Node.js Backend with Amazon SES SMTP)
  contact_service:
    build: ./contact
    image: ${DOCKERHUB_NAMESPACE:-local}/contact:${CONTACT_IMAGE_TAG:-latest}
    container_name: contact_service
    expose:
      - "3000"
    env_file:
      - path: ./contact/.env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    name: app_default
    driver: bridge
