services:
  # Portfolio Service (Homepage + Contact Form)
  portfolio_service:
    build: ./portfolio
    image: ${DOCKERHUB_NAMESPACE:-local}/portfolio:${PORTFOLIO_IMAGE_TAG:-latest}
    container_name: portfolio_service
    ports:
      - "80:80"
    restart: unless-stopped

  # Experience Service
  experience_service:
    build: ./experience
    image: experience:latest
    container_name: experience_service
    expose:
      - "80"
    restart: unless-stopped

  # Projects Service
  projects_service:
    build: ./projects
    image: projects:latest
    container_name: projects_service
    expose:
      - "80"
    restart: unless-stopped

  # Blog Service
  blog_service:
    build: ./blog
    image: blog:latest
    container_name: blog_service
    expose:
      - "80"
    restart: unless-stopped

  # Contact Service (Node.js Backend with Amazon SES SMTP)
  contact_service:
    build: ./contact
    image: ${DOCKERHUB_NAMESPACE:-local}/contact:${CONTACT_IMAGE_TAG:-latest}
    container_name: contact_service
    expose:
      - "3000"
    env_file:
      - path: ./contact/.env
        required: false
    restart: unless-stopped

networks:
  default:
    name: app_default
    driver: bridge
