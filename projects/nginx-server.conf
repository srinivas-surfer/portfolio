server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index projects.html;

  location = /assets {
    return 404;
  }

  location = /assets/ {
    return 404;
  }

  location = /assets/icons {
    return 404;
  }

  location = /assets/icons/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /projects.html;
  }
}
